generated: '2026-09-09'
method: searched
source: >-
  Public package registries (npm, PyPI, RubyGems, NuGet, Packagist, Maven Central)
  and the First Data / GBSEcom GitHub organizations. First-party status confirmed
  from registry maintainer records (npm maintainer justin.slingerland@firstdata.com
  on @firstdata/first-data-gateway; npm maintainer payeezy.api@firstdata.com on
  payeezy) and from the @firstdata / first-data / GBSEcom namespaces.
note: >-
  First Data merged into Fiserv in 2019. The First Data Gateway (IPG) client
  libraries are published under the GBSEcom ("Global Business Solutions
  eCommerce") organization, which is First Data's own eCommerce engineering org —
  the packages carry the @firstdata / first-data / FirstData.Gateway names and
  their descriptions say "First Data's IPG API (version 21.5.0)". Every one of the
  six first-party gateway SDKs was last published on 2021-11-19, and no release has
  followed in the four years since; Fiserv has since directed First Data and
  Payeezy gateway merchants to Commerce Hub. The dated release floor is the
  strongest abandonment signal available for this surface.
