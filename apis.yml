apis:
  - aid: first-data:fiserv-developer
    name: Fiserv Developer (First Data Legacy)
    tags:
      - Payments
      - Merchant Services
      - Transaction Processing
    humanURL: https://developer.fiserv.com
    properties:
      - url: https://developer.fiserv.com
        type: DeveloperPortal
      - url: https://developer.fiserv.com
        type: Documentation
      - url: https://developer.fiserv.com/support
        type: Support
    description: >-
      Following the Fiserv merger, legacy First Data API products are now
      hosted on the Fiserv developer portal. These include Commerce Hub,
      Payeezy, and Bolt for merchant payment acceptance, tokenization, and
      transaction processing.
  - aid: first-data:first-data-gateway
    name: First Data Gateway (IPG)
    tags:
      - Payments
      - Merchant Services
      - Transaction Processing
      - Tokenization
      - Fraud
    humanURL: https://developer.fiserv.com/product/IPGNA
    baseURL: https://prod.api.firstdata.com/gateway/v2
    properties:
      - url: https://developer.fiserv.com/product/IPGNA
        type: APIReference
      - url: https://github.com/GBSEcom
        type: SourceCode
      - url: authentication/first-data-authentication.yml
        type: Authentication
      - url: conventions/first-data-conventions.yml
        type: Conventions
      - url: errors/first-data-problem-types.yml
        type: ErrorCatalog
      - url: errors/first-data-decline-codes.yml
        type: DeclineCodes
      - url: sandbox/first-data-sandbox.yml
        type: Sandbox
    description: >-
      The First Data Gateway, marketed by Fiserv as the Internet Payment Gateway
      (IPG) and documented on the Fiserv developer portal as the IPGNA product.
      A card, ACH and wallet transaction API covering payments, orders, payment
      schedules, tokenization, hosted payment URLs, card and account
      verification, dynamic currency conversion and fraud scoring. Production is
      https://prod.api.firstdata.com/gateway/v2 and certification is
      https://cert.api.firstdata.com/gateway/v2; both base URLs are read from
      First Data's own published client libraries at github.com/GBSEcom, since
      no OpenAPI document is served at any reachable URL. API version 21.5.0.
      Authentication is an Api-Key header plus an HMAC-SHA256 Message-Signature.
