    statement: First Data and Payeezy gateways will be deprecated at the end of Q3 2025, as mandated by Fiserv.
    effective: '2025-09-30'
    successor: Fiserv Commerce Hub
    source: https://docs.recurly.com/recurly-subscriptions/docs/commerce-hub
    source_type: third-party
    source_note: >-
      Recorded from a payments platform's integration documentation attributing the
      mandate to Fiserv. Fiserv's own migration guides exist on
      developer.fiserv.com under
      /product/CommerceHub/docs/?path=docs/Resources/Guides/Payeezy/ but that portal
