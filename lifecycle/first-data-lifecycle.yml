summary: >-
  Every First Data-branded developer surface is in wind-down. The First Data
  Gateway (IPG) survives on the Fiserv portal as the IPGNA product; Payeezy does
  not appear in the portal sitemap at all; the developer hosts, the status page and
  the SDK release stream are all decommissioned or frozen.
